# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# Unit tests build the schema from the entities on H2; the MariaDB migrations run in the e2e stack.
spring.flyway.enabled=false
# Store Java enums as VARCHAR, not native MariaDB ENUM columns: a new enum constant
# then needs no ALTER TABLE, and cannot fail at runtime for a forgotten one.
spring.jpa.properties.hibernate.type.prefer_native_enum_types=false
spring.sql.init.mode=never
