# Content-Security-Policy for the public reservation form, rendered at container startup by
# 41-render-csp.sh: __API_ORIGIN__ becomes the origin of API_URL, and __CSP_HEADER__ becomes
# Content-Security-Policy, or Content-Security-Policy-Report-Only when CSP_REPORT_ONLY=true.
#   style-src 'unsafe-inline': React inline styles and the <style> elements the ALTCHA widget injects.
#   img-src data:            : inline SVG icons in index.css.
#   worker-src blob:          : ALTCHA solves its proof-of-work in a Web Worker created from a blob URL.
#   https://*.sentry.io       : error reports (any Sentry ingest region).
add_header __CSP_HEADER__ "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' __API_ORIGIN__ https://*.sentry.io; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
