server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (nginx-security-headers.conf, shared by both apps)
    include /etc/nginx/snippets/security-headers.conf;
    # Content-Security-Policy. This nginx.conf is shared by both apps, but the policy differs per app,
    # so it lives in each app's nginx-csp.conf and is rendered at container startup with the API
    # origin filled in.
    # Declared here at server level so every location without its own add_header inherits it.
    include /etc/nginx/snippets/csp.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Vite's hashed build output: a file's name changes with its content, so cache it for a year.
    # ^~ so the regex location below is not consulted for these.
    location ^~ /assets/ {
        # No "always": only successful responses get it, so a 404 (for example a bundle requested
        # mid-deploy) is never cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # This add_header drops the server-level ones, so include them again.
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
    }

    # Unhashed static files: the runtime config written at container startup (40-inject-config.sh)
    # and the files copied from each app's public/ folder (favicon, logos, fonts, help screenshots).
    # Browsers keep them but revalidate on every load (a cheap 304 when unchanged), so a changed
    # setting or a replaced file shows up right away.
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint. default_type instead of add_header, so the server-level headers still apply.
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }
}
