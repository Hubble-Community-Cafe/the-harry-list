# Content-Security-Policy for the staff admin, rendered at container startup by 41-render-csp.sh:
# __API_ORIGIN__ becomes the origin of API_URL, and __CSP_HEADER__ becomes Content-Security-Policy,
# or Content-Security-Policy-Report-Only when CSP_REPORT_ONLY=true.
#   style-src 'unsafe-inline'       : React inline styles.
#   img-src data:                   : inline SVG icons in index.css.
#   login.microsoftonline.com       : MSAL token requests (connect-src) and silent renewal in a hidden iframe (frame-src).
#   graph.microsoft.com             : the staff-group check in useGroupAuthorization.
#   https://*.sentry.io             : error reports (any Sentry ingest region).
add_header __CSP_HEADER__ "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' __API_ORIGIN__ https://login.microsoftonline.com https://graph.microsoft.com https://*.sentry.io; frame-src 'self' https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
