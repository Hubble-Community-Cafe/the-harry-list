name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions for all jobs
permissions:
  contents: read

jobs:
  # ==================== FRONTEND SYNC CHECK ====================
  frontend-sync:
    name: Frontend Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The shared code lives in the-harry-list-shared, so no files are duplicated anymore. What can
      # still drift is the declared version ranges: a dependency used by more than one of the three
      # workspace packages must use the same range everywhere, or the workspace installs two
      # versions of it (two Reacts, two Vites) side by side.
      - name: Check shared dependency versions
        run: |
          node -e "
            const pkgs = ['the-harry-list-shared', 'the-harry-list-public', 'the-harry-list-admin']
              .map((dir) => [dir, require('./' + dir + '/package.json')]);
            const ranges = {};
            for (const [dir, pkg] of pkgs) {
              for (const group of ['dependencies', 'devDependencies', 'peerDependencies']) {
                for (const [dep, range] of Object.entries(pkg[group] || {})) {
                  if (dep.startsWith('the-harry-list-')) continue;
                  (ranges[dep] ||= {})[dir] = range;
                }
              }
            }
            let drift = 0;
            for (const [dep, byPkg] of Object.entries(ranges)) {
              if (new Set(Object.values(byPkg)).size > 1) {
                drift++;
                console.log('::error::VERSION DRIFT: ' + dep + ' ' + JSON.stringify(byPkg));
              }
            }
            if (drift) {
              console.log('Align these ranges in the workspace package.json files.');
              process.exit(1);
            }
            console.log('All shared dependency versions are aligned.');
          "

  version-check:
    name: Version Bump Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check version was bumped
        run: |
          PR_VERSION=$(node -p "require('./the-harry-list-public/package.json').version")
          MAIN_VERSION=$(git show origin/main:the-harry-list-public/package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")

          echo "PR version:   $PR_VERSION"
          echo "Main version: $MAIN_VERSION"

          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "::error::Version has not been bumped. Update the version in package.json (both frontends) and pom.xml before merging."
            exit 1
          fi

          # Verify all three packages have the same version
          ADMIN_VERSION=$(node -p "require('./the-harry-list-admin/package.json').version")
          BACKEND_VERSION=$(sed -n '/<parent>/,/<\/parent>/d; s/.*<version>\(.*\)<\/version>.*/\1/p' the-harry-list-backend/pom.xml | head -1)

          echo "Admin version:   $ADMIN_VERSION"
          echo "Backend version: $BACKEND_VERSION"

          MISMATCH=false
          if [ "$PR_VERSION" != "$ADMIN_VERSION" ]; then
            echo "::error::Admin version ($ADMIN_VERSION) does not match public version ($PR_VERSION)"
            MISMATCH=true
          fi
          if [ "$PR_VERSION" != "$BACKEND_VERSION" ]; then
            echo "::error::Backend version ($BACKEND_VERSION) does not match public version ($PR_VERSION)"
            MISMATCH=true
          fi

          if [ "$MISMATCH" = true ]; then
            exit 1
          fi

          echo "Version bumped from $MAIN_VERSION to $PR_VERSION across all packages."

  # ==================== BACKEND ====================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-harry-list-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run unit tests
        run: mvn test -B

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: backend-test-results
          path: the-harry-list-backend/target/surefire-reports/

      # Coverage is report-only for now (no minimum): totals on the run page, full report as artifact.
      - name: Coverage summary
        if: always() && hashFiles('the-harry-list-backend/target/site/jacoco/jacoco.csv') != ''
        run: python3 ../scripts/coverage-summary.py "Backend" jacoco target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && hashFiles('the-harry-list-backend/target/site/jacoco/jacoco.csv') != ''
        with:
          name: backend-coverage
          path: the-harry-list-backend/target/site/jacoco/
          retention-days: 14

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: the-harry-list-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests -B

  # ==================== FRONTENDS ====================
  # One job per workspace package. Each keeps its own check name, so branch protection's
  # required checks ("Shared Frontend Tests" and so on) still match.
  frontend-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Independent packages: a failure in one should not cancel the others.
      fail-fast: false
      matrix:
        include:
          - package: the-harry-list-shared
            name: Shared Frontend Tests
            summary: Shared frontend package
            coverage-artifact: shared-coverage
            # No build of its own (the apps compile its source), so type-check it here.
            typecheck: true
            build: false
          - package: the-harry-list-public
            name: Public Frontend Tests
            summary: Public frontend
            coverage-artifact: public-coverage
            typecheck: false
            build: true
          - package: the-harry-list-admin
            name: Admin Frontend Tests
            summary: Admin frontend
            coverage-artifact: admin-coverage
            typecheck: false
            build: true
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspace: one install at the repo root for all frontend packages (one root lockfile).
      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Type check
        if: matrix.typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      # Coverage is report-only for now (no minimum): totals on the run page, full report as artifact.
      - name: Coverage summary
        if: always() && hashFiles(format('{0}/coverage/coverage-summary.json', matrix.package)) != ''
        run: python3 ../scripts/coverage-summary.py "${{ matrix.summary }}" vitest coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && hashFiles(format('{0}/coverage/coverage-summary.json', matrix.package)) != ''
        with:
          name: ${{ matrix.coverage-artifact }}
          path: ${{ matrix.package }}/coverage/
          retention-days: 14

      - name: Build
        if: matrix.build
        run: npm run build

  # ==================== DOCKER BUILD & PUSH ====================
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    # Only build and push on main branch, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Publishing waits for a maintainer. Portainer pulls these images, so a push
    # to GHCR is effectively a deploy. The `production` environment's required
    # reviewers turn that into a deliberate step rather than a side effect of
    # merging. sentry-release and github-release both `needs:` this job, so they
    # inherit the gate.
    environment: production
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute lowercase owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract project version
        id: version
        run: echo "version=$(node -p "require('./the-harry-list-public/package.json').version")" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each image: build locally, report to the Security tab, block on fixable critical CVEs.
      # Nothing is pushed yet; see .github/actions/build-scan-image.
      - name: Build and scan Backend image
        uses: ./.github/actions/build-scan-image
        with:
          image: ghcr.io/${{ steps.vars.outputs.owner }}/the-harry-list-backend
          label: backend
          version: ${{ steps.version.outputs.version }}
          context: ./the-harry-list-backend
          dockerfile: ./the-harry-list-backend/Dockerfile

      - name: Build and scan Public Frontend image
        uses: ./.github/actions/build-scan-image
        with:
          image: ghcr.io/${{ steps.vars.outputs.owner }}/the-harry-list-public
          label: public
          version: ${{ steps.version.outputs.version }}
          context: .
          dockerfile: ./the-harry-list-public/Dockerfile
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Build and scan Admin Frontend image
        uses: ./.github/actions/build-scan-image
        with:
          image: ghcr.io/${{ steps.vars.outputs.owner }}/the-harry-list-admin
          label: admin
          version: ${{ steps.version.outputs.version }}
          context: .
          dockerfile: ./the-harry-list-admin/Dockerfile
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # ========== PUSH ==========
      # Only now, with all three images through the gate, publish them together. A failure above
      # therefore never leaves a half-released version (e.g. a new backend with an old admin).
      - name: Push Backend Docker image
        run: docker push --all-tags ghcr.io/${{ steps.vars.outputs.owner }}/the-harry-list-backend

      - name: Push Public Frontend Docker image
        run: docker push --all-tags ghcr.io/${{ steps.vars.outputs.owner }}/the-harry-list-public

      - name: Push Admin Frontend Docker image
        run: docker push --all-tags ghcr.io/${{ steps.vars.outputs.owner }}/the-harry-list-admin

  # ==================== SENTRY RELEASE ====================
  # One release per project, named <project>@<version> exactly like the SDKs and the source map
  # upload, so the commits and deploy land on the release the events report.
  sentry-release:
    name: Create Sentry Release (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        project: [the-harry-list-backend, the-harry-list-public, the-harry-list-admin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "version=$(node -p "require('./the-harry-list-public/package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Sentry release
        uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: stichting-bar-potential
        with:
          projects: ${{ matrix.project }}
          version: ${{ matrix.project }}@${{ steps.version.outputs.version }}
          environment: production

  # ==================== GITHUB RELEASE ====================
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version
        id: version
        run: echo "version=$(node -p "require('./the-harry-list-public/package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check-tag
        run: |
          if git ls-remote --tags origin "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Get merged PR info
        id: pr-info
        if: steps.check-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the PR that was just merged for this push
          PR_JSON=$(gh pr list --state merged --base main --json number,title,body --limit 1 \
            --jq '.[0] // empty')

          if [ -n "$PR_JSON" ]; then
            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
            PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
            PR_BODY=$(echo "$PR_JSON" | jq -r '.body // ""')

            echo "title=$PR_TITLE (#$PR_NUMBER)" >> $GITHUB_OUTPUT
            echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

            # Write body to file to handle multiline
            echo "$PR_BODY" > /tmp/pr_body.md
          else
            echo "title=Release v${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
            echo "" > /tmp/pr_body.md
          fi

      - name: Create release
        if: steps.check-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          PR_TITLE="${{ steps.pr-info.outputs.title }}"
          PR_NUM="${{ steps.pr-info.outputs.number }}"

          # Build release body
          {
            if [ -n "$PR_TITLE" ]; then
              echo "**$PR_TITLE**"
              if [ -n "$PR_NUM" ]; then
                echo "(#$PR_NUM)"
              fi
              echo ""
            fi
            if [ -s /tmp/pr_body.md ]; then
              cat /tmp/pr_body.md
            fi
          } > /tmp/release_body.md

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file /tmp/release_body.md
