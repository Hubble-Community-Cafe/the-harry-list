version: 2

# ──────────────────────────────────────────────────────────────────────────────
# Dependabot targets the long-lived `develop` integration branch, NOT `main`.
#
# Why: `main` requires the "Version Bump Check" (see .github/workflows/ci.yml),
# which fails on any PR that doesn't bump the app version. `develop` is kept one
# patch ahead of `main`, so Dependabot PRs inherit that bumped version and pass
# the check automatically — letting them merge (and auto-merge) individually.
# Releases then flow as a single `develop -> main` PR.
#
# Grouping keeps each ecosystem to at most two PRs per run:
#   * one batched PR for minor/patch updates  -> auto-merged into develop
#   * one isolated PR for major updates        -> reviewed manually
#
# `cooldown` holds back freshly published releases for a few days. Since the
# minor/patch group auto-merges, that window is what stops a compromised release
# reaching `develop` unreviewed. Cooldown applies to version updates only —
# Dependabot *security* updates bypass it, so genuine fixes are never delayed.
# ──────────────────────────────────────────────────────────────────────────────

updates:
  # ── Backend (Maven) ──────────────────────────────────────────────────────────
  - package-ecosystem: "maven"
    directory: "/the-harry-list-backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    reviewers:
      - "PimVanLeeuwen"
    labels:
      - "dependencies"
      - "backend"
    groups:
      # Everything non-major in a single PR (auto-merged into develop)
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Majors isolated for manual review
      backend-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ── Admin Frontend (npm) ──────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/the-harry-list-admin"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    reviewers:
      - "PimVanLeeuwen"
    labels:
      - "dependencies"
      - "frontend"
      - "admin"
    groups:
      admin-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      admin-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # TypeScript majors are unusable until typescript-eslint supports them: its
      # typescript-estree caps the supported range (currently <6.1.0) and the
      # "overrides" block in package.json pins typescript-eslint to the project's
      # TypeScript, so a TS major makes `eslint .` crash on startup. Grouped major
      # PRs would drag other, perfectly fine majors down with it.
      # Remove this once typescript-eslint announces support for the next TS major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ── Public Frontend (npm) ─────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/the-harry-list-public"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    reviewers:
      - "PimVanLeeuwen"
    labels:
      - "dependencies"
      - "frontend"
      - "public"
    groups:
      public-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      public-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Same as the admin app: TypeScript majors break `eslint .` until
      # typescript-eslint raises its supported TypeScript range. See the comment
      # in the admin section above.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    # github-actions supports only `default-days` — the per-SemVer-bump keys are
    # not available for this ecosystem.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "PimVanLeeuwen"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
