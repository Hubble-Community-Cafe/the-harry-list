version: 2

# ──────────────────────────────────────────────────────────────────────────────
# Dependabot targets the long-lived `develop` integration branch, NOT `main`.
#
# Why: `main` requires the "Version Bump Check" (see .github/workflows/ci.yml),
# which fails on any PR that doesn't bump the app version. `develop` is kept one
# patch ahead of `main`, so Dependabot PRs inherit that bumped version and pass
# the check automatically — letting them merge (and auto-merge) individually.
# Releases then flow as a single `develop -> main` PR.
#
# Grouping keeps each ecosystem to at most two PRs per run:
#   * one batched PR for minor/patch updates  -> auto-merged into develop
#   * one isolated PR for major updates        -> reviewed manually
#
# `cooldown` holds back freshly published releases for a few days. Since the
# minor/patch group auto-merges, that window is what stops a compromised release
# reaching `develop` unreviewed. Cooldown applies to version updates only —
# Dependabot *security* updates bypass it, so genuine fixes are never delayed.
# ──────────────────────────────────────────────────────────────────────────────

# Reviews: Dependabot's old "reviewers" key is gone; .github/CODEOWNERS requests the owner's review
# on every PR, Dependabot's included.
updates:
  # ── Backend (Maven) ──────────────────────────────────────────────────────────
  - package-ecosystem: "maven"
    directory: "/the-harry-list-backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      # Everything non-major in a single PR (auto-merged into develop)
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Majors isolated for manual review
      backend-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ── Frontends (npm workspace) ────────────────────────────────────────────────
  # One entry at the workspace root: the public and admin apps share one root
  # package-lock.json, so Dependabot must update them together from "/".
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      frontend-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # TypeScript majors are unusable until typescript-eslint supports them: its
      # typescript-estree caps the supported range (currently <6.1.0) and the
      # "overrides" block in the root package.json pins typescript-eslint to the
      # project's TypeScript, so a TS major makes `eslint .` crash on startup. Grouped
      # major PRs would drag other, perfectly fine majors down with it.
      # Remove this once typescript-eslint announces support for the next TS major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ── End-to-end tests (npm, own lockfile) ────────────────────────────────────
  # e2e/ is not part of the frontend workspace: Playwright and its helpers have their
  # own package.json and package-lock.json. No TypeScript ignore here: e2e has no
  # typescript-eslint, so a TypeScript major does not break it.
  - package-ecosystem: "npm"
    directory: "/e2e"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    groups:
      e2e-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      e2e-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ── Docker base images ──────────────────────────────────────────────────────
  # The FROM images of the three Dockerfiles (node, maven, eclipse-temurin). Tags
  # without a version, like nginx:alpine, cannot be tracked and resolve to the
  # newest image on every build anyway. The images are built in PR CI by the e2e
  # stack, so a broken base image fails the "Playwright E2E" check.
  - package-ecosystem: "docker"
    directories:
      - "/the-harry-list-backend"
      - "/the-harry-list-public"
      - "/the-harry-list-admin"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    # docker, like github-actions, supports only `default-days`: image tags are
    # not required to follow SemVer.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ── GitHub Actions ────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    # github-actions supports only `default-days` — the per-SemVer-bump keys are
    # not available for this ecosystem.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
